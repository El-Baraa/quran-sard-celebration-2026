<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصميم بطاقة المعاينة - السرد القرآني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #051c14;
      font-family: 'Cairo', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    /* الحاوية بأبعاد 1200x630 المناسبة تماماً لصور المعاينة (Open Graph) */
    .preview-card-wrapper {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0d3b2e 0%, #08261e 100%);
      border: 6px solid #c5a059;
      border-radius: 24px;
      padding: 50px 60px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }
    /* تأثيرات خلفية خفيفة جمالية */
    .preview-card-wrapper::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .quran-ayah {
      font-family: 'Amiri', serif;
      font-size: 2.8rem;
      color: #f4e8c1;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .ayah-translation {
      font-family: 'Amiri', serif;
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 25px;
    }
    .divider {
      width: 150px;
      height: 3px;
      background-color: #c5a059;
      margin: 0 auto 25px auto;
      border-radius: 2px;
    }
    .main-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #c5a059;
      margin-bottom: 12px;
    }
    .main-desc {
      font-size: 1.35rem;
      color: #d1d5db;
      line-height: 1.6;
      max-width: 900px;
    }
    .card-footer-badge {
      font-size: 1rem;
      color: #9ca3af;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 25px;
      border-radius: 30px;
      border: 1px solid rgba(197, 160, 89, 0.3);
    }
  </style>
</head>
<body>

  <div class="preview-card-wrapper">
    <div>
      <div class="quran-ayah">﴿وَفِي ذَٰلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ﴾</div>
      <div class="ayah-translation">فَرِحِينَ بِمَا آتَاهُمُ اللَّهُ مِن فَضْلِهِ</div>
      <div class="divider"></div>
    </div>

    <div>
      <h1 class="main-title">الإمام الإسلامي بالصف البلد | فرحة السرد القرآني</h1>
      <p class="main-desc">احتفالية إتمام السرد القرآني بمركز الإمام الإسلامي - دفعة ختام الألفية الثانية 2026م.</p>
    </div>

    <div class="card-footer-badge">
      el-baraa.github.io/quran-sard-celebration-2026
    </div>
  </div>

</body>
</html>
